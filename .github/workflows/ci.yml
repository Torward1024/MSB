name: CI

on:
  push:
    branches: [ main ]
  # Also on every pull request: a suite that only runs after a merge cannot stop anything.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest

    # The tests import msb_arch, never src/, so they run against whatever is installed.
    # Building and installing the wheel here means CI exercises the distribution that
    # actually ships, including whether py.typed and every subpackage made it in.
    - name: Build the distribution
      run: python -m build

    - name: Install the built wheel
      run: pip install dist/*.whl

    - name: Check the installed package is the one under test
      run: |
        python -c "import msb_arch, os; p = os.path.dirname(msb_arch.__file__); print(p); assert 'site-packages' in p, 'tests would run against the source tree'"

    - name: Run unit tests
      run: pytest tests/ -v --ignore=tests/integration --ignore=tests/performance

    - name: Run integration tests
      run: pytest tests/integration/ -v

    # Benchmarks assert ratios, call counts and scaling rather than wall-clock times, so a
    # slow or noisy runner does not fail them and a real regression does.
    - name: Run performance tests and benchmarks
      run: pytest tests/performance/ -v
