[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msb_arch"
# The version lives in one place: `msb_arch.__version__`. It used to live here as well, and
# 1.1.2 was tagged and released with only the other one bumped -- so the build produced 1.1.1
# again and PyPI refused it as a file it already had. Two sources of one number is one too many.
dynamic = ["version"]
description = "A dependency-free domain layer for Python: entities, invariants and operations behind one entry point, driven by requests that are data"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Alexey Rudnitskiy", email = "almax1024@gmail.com"}
]
keywords = ["msb", "domain-driven-design", "ddd", "domain-model", "hexagonal-architecture", "ports-and-adapters", "command-pattern", "validation", "invariants", "replay"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Torward1024/MSB"
Documentation = "https://github.com/Torward1024/MSB/docs"
Repository = "https://github.com/Torward1024/MSB"
Issues = "https://github.com/Torward1024/MSB/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/msb_arch"]
# Apache-2.0 asks that the NOTICE travel with the code, so it ships in the distribution.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]
[tool.hatch.version]
path = "src/msb_arch/__init__.py"
